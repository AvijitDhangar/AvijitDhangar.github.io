# OPTIONAL: copy this file into the NOTES repo (AvijitDhangar/blog) at
#   .github/workflows/notify-website.yml
# It tells the website repo to rebuild right after you publish from Obsidian.
# Vercel ignores it, so your existing blog keeps working untouched.
# Needs a secret named SITE_DISPATCH_TOKEN in the notes repo (see README, step 5).
name: Notify website
on:
  push:
    branches: [main]
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger website rebuild
        run: |
          curl -sS -f -X POST \
            -H "Authorization: Bearer ${{ secrets.SITE_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/AvijitDhangar/AvijitDhangar.github.io/dispatches \
            -d '{"event_type":"notes-updated"}'
