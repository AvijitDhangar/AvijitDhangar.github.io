name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:           # "Run workflow" button in the Actions tab
  repository_dispatch:         # instant rebuild, sent by the notes repo (see docs/notes-repo-trigger.yml)
    types: [notes-updated]
  schedule:
    - cron: '*/30 * * * *'     # safety net: checks the notes repo every 30 minutes

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  BLOG_REPO: AvijitDhangar/blog
  BLOG_BRANCH: main

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.decide.outputs.changed }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Latest commit of the notes repo
        id: sha
        env:
          TOKEN: ${{ secrets.BLOG_READ_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then URL="https://x-access-token:${TOKEN}@github.com/${BLOG_REPO}.git"; else URL="https://github.com/${BLOG_REPO}.git"; fi
          SHA=$(git ls-remote "$URL" "refs/heads/${BLOG_BRANCH}" | cut -f1)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
      - name: Was this commit already built?
        id: seen
        uses: actions/cache/restore@v4
        with:
          path: .built
          key: built-${{ steps.sha.outputs.sha }}
          lookup-only: true
      - name: Decide
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ steps.seen.outputs.cache-hit }}" = "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "Notes unchanged, skipping build."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync notes and build
        env:
          BLOG_TOKEN: ${{ secrets.BLOG_READ_TOKEN }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Remember the commit we built
        run: mkdir -p .built && echo "${{ needs.check.outputs.sha }}" > .built/sha
      - uses: actions/cache/save@v4
        with:
          path: .built
          key: built-${{ needs.check.outputs.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
